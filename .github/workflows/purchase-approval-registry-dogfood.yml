name: purchase-approval-registry-dogfood

on:
  push:
    branches:
      - agent/purchase-approval-dogfood-proof

permissions:
  contents: read

jobs:
  dogfood:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install released Runx CLI
        run: npm install --global @runxhq/cli@0.7.1

      - name: Acquire public package and replay hosted harness
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/purchase-approval-evidence"
          install_root="$RUNNER_TEMP/purchase-approval-install"
          mkdir -p "$evidence" "$install_root"
          runx --version > "$evidence/runx-version.txt"
          runx registry read q10283245/purchase-approval@0.2.0 \
            --registry https://api.runx.ai --json > "$evidence/registry.json"
          runx add q10283245/purchase-approval@0.2.0 \
            --registry https://api.runx.ai --to "$install_root" --json > "$evidence/install.json"
          package_skill="$(find "$install_root" -type f -name SKILL.md -path '*/purchase-approval/*' -print -quit)"
          test -n "$package_skill"
          package_dir="$(dirname "$package_skill")"
          runx harness "$package_dir" --json > "$evidence/harness.json"
          jq -e '.status == "passed" and .case_count == 2 and .assertion_error_count == 0' "$evidence/harness.json"

      - name: Run owner-reference dogfood and verify receipt
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/purchase-approval-evidence"
          receipts="$evidence/receipts"
          mkdir -p "$receipts"

          seed="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("base64"))')"
          public_key="$(SEED="$seed" node -e 'const c=require("node:crypto");const s=Buffer.from(process.env.SEED,"base64");const p=Buffer.from("302e020100300506032b657004220420","hex");const k=c.createPrivateKey({key:Buffer.concat([p,s]),format:"der",type:"pkcs8"});process.stdout.write(c.createPublicKey(k).export({format:"der",type:"spki"}).subarray(-32).toString("base64"))')"
          export RUNX_RECEIPT_SIGN_KID=purchase-approval-registry-dogfood-020
          export RUNX_RECEIPT_SIGN_ED25519_SEED_BASE64="$seed"
          export RUNX_RECEIPT_SIGN_ISSUER_TYPE=hosted
          export RUNX_DATA_SOURCES='{"data_sources":{"tenant://purchase-approval/budgets":{"adapter":"data.local","resources":{"budget_events":{"kind":"event_stream","partition_key":"aggregate_id"}}}}}'
          printf '%s\n' "$public_key" > "$evidence/public-key-base64.txt"

          set +e
          runx skill q10283245/purchase-approval@0.2.0 purchase-approval-with-budget-fixture \
            --registry https://api.runx.ai \
            --skip-operator-context \
            --receipt-dir "$receipts" \
            --json \
            --input-json data_source_ref='"tenant://purchase-approval/budgets"' \
            --input-json store_id='"purchase-approval-registry-dogfood-v020"' \
            --input-json budget_period='"2026-07"' \
            --input-json cost_center='"engineering-platform-registry-dogfood"' \
            --input-json budget_seed_idempotency_key='"budget:engineering-platform-registry-dogfood:2026-07:open"' \
            --input-json budget_seed_event='{"type":"budget.opened","payload":{"budget_period":"2026-07","currency":"USD","amount":2200}}' \
            --input-json idempotency_key='"purchase:engineering-platform-registry-dogfood:2026-07:acme-hosting"' \
            --input-json purchase_request='{"amount":480,"currency":"USD","vendor":"Acme Hosting","purpose":"Annual staging infrastructure renewal"}' \
            --input-json procurement_policy='{"approved_vendors":["Acme Hosting","Example Office Supply"],"max_single_purchase":1000,"requires_approval_above":250}' \
            --input-json requested_scope='{"amount":480,"currency":"USD","counterparty":"Acme Hosting","scopes":["purchase:hosting"]}' \
            --input-json mcp_tool_call='{"tool":"hosting.renew","arguments":{"environment":"staging"}}' \
            --input-json provider_policy='{"price_minor":480,"currency":"USD","accepted_settlement_families":["mock"],"counterparty":"Acme Hosting"}' \
            --input-json returned_credential='{"family":"mock","credential_ref":"credential:mock:acme-hosting-registry-dogfood-2026-07"}' \
            --input-json verify_capability_ref='"capability:charge-verify:acme-hosting-registry-dogfood-2026-07"' \
            --input-json charge_idempotency_seed='"acme-hosting-registry-dogfood-2026-07"' \
            > "$evidence/start.json"
          start_code=$?
          set -e
          test "$start_code" -eq 2
          jq -e '.status == "needs_agent" and (.requests | length) == 1' "$evidence/start.json"
          run_id="$(jq -r '.run_id' "$evidence/start.json")"

          python3 - "$RUNNER_TEMP/answers.json" <<'PY'
          import json
          import sys

          answers = {
              "answers": {
                  "agent_task.purchase-approval.output": {
                      "decision": {
                          "approved": True,
                          "reason": "The approved vendor request is within the 1000 USD cap, the authoritative stored 2200 USD balance, the exact requested scope, and the matching mock provider price."
                      },
                      "attenuation_request": {"amount": 480, "currency": "USD", "counterparty": "Acme Hosting", "scopes": ["purchase:hosting"]},
                      "budget_event": {
                          "type": "purchase.committed",
                          "payload": {"budget_period": "2026-07", "amount": 480, "currency": "USD", "vendor": "Acme Hosting", "purpose": "Annual staging infrastructure renewal"}
                      },
                      "escalation": None
                  },
                  "purchase-approval.human-review": True,
                  "agent_task.charge-price.output": {
                      "charge_price": {"price_id": "charge_price_acme_2026_07", "amount_minor": 480, "currency": "USD", "settlement_families": ["mock"]},
                      "requested_payment_authority": {"authority_ref": "authority:payment:purchase-approval-acme-2026-07"}
                  },
                  "agent_task.charge-challenge.output": {
                      "effect_required_signal": {"signal_type": "effect_required", "challenge_id": "charge_challenge_acme_2026_07"},
                      "charge_challenge": {"challenge_id": "charge_challenge_acme_2026_07", "receipt_before_forward_required": True},
                      "idempotency": {"key": "charge:acme-hosting-2026-07"},
                      "accepted_settlement_families": ["mock"]
                  },
                  "agent_task.charge-verify.output": {
                      "verification_result": {"status": "verified", "settlement_family": "mock"},
                      "settlement_proof": {"proof_ref": "receipt-proof:mock-charge:acme-hosting-2026-07", "idempotency_key": "charge:acme-hosting-2026-07"},
                      "sealed_receipt_ref": "receipt:charge:mock:acme-hosting-2026-07",
                      "redactions": ["credential_material"],
                      "recovery_hint": {"status": "sealed"}
                  },
                  "agent_task.seal.output": {"sealed": True, "receipt_ref": "receipt:charge:mock:acme-hosting-2026-07"},
                  "agent_task.forward.output": {"forwarded": True, "result_ref": "result:hosting-renewal:staging"}
              }
          }
          with open(sys.argv[1], "w", encoding="utf-8") as handle:
              json.dump(answers, handle, indent=2)
          PY

          runx resume "$run_id" "$RUNNER_TEMP/answers.json" \
            --receipt-dir "$receipts" --json > "$evidence/resume.json"
          jq -e '.status == "sealed" and .closure.disposition == "closed"' "$evidence/resume.json"
          receipt_id="$(jq -r '.receipt_id' "$evidence/resume.json")"
          receipt_file="$receipts/sha256-${receipt_id#sha256:}.json"
          test -f "$receipt_file"
          RUNX_RECEIPT_VERIFY_KID="$RUNX_RECEIPT_SIGN_KID" \
          RUNX_RECEIPT_VERIFY_ED25519_PUBLIC_KEY_BASE64="$public_key" \
            runx verify --receipt "$receipt_file" --json > "$evidence/verification.json"
          jq -e '.valid == true and .digest.status == "valid" and .content_address.status == "valid" and .signature.status == "valid"' "$evidence/verification.json"

          jq '
            (.execution.skill_claim.step_outputs["approve-and-charge"].raw | fromjson) as $approval |
            ($approval.step_outputs.charge.raw | fromjson) as $charge |
            {
              status,
              run_id,
              receipt_id,
              closure,
              budget_projection: .execution.skill_claim.step_outputs["approve-and-charge"].data_operation_result.data.projection,
              cas: $approval.step_outputs["append-budget-event"].data_operation_result.data,
              approval_graph_receipt_id: $approval.graph_receipt_id,
              mock_charge_graph_receipt_id: $charge.graph_receipt_id,
              mock_charge: {
                price: $charge.step_outputs.price.charge_price,
                challenge: $charge.step_outputs.challenge.charge_challenge,
                verification: $charge.step_outputs.verify.verification_result,
                sealed_receipt_ref: $charge.step_outputs.verify.sealed_receipt_ref,
                seal: $charge.step_outputs.seal,
                forward: $charge.step_outputs.forward
              }
            }
          ' "$evidence/resume.json" > "$evidence/summary.json"
          jq -e '.budget_projection.version == 2 and .budget_projection.committed_spend == 480 and .budget_projection.current_budget_balance == 1720 and .cas.before_version == 1 and .cas.after_version == 2 and .mock_charge.verification.status == "verified" and .mock_charge.forward.forwarded == true' "$evidence/summary.json"
          unset seed RUNX_RECEIPT_SIGN_ED25519_SEED_BASE64

      - name: Upload registry dogfood evidence
        uses: actions/upload-artifact@v7
        with:
          name: purchase-approval-registry-dogfood
          path: ${{ runner.temp }}/purchase-approval-evidence
          if-no-files-found: error
          retention-days: 7
